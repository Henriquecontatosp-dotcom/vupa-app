
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5126D8">
<title>VUPA | Sua corrida, segura.</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--roxo:#5126D8;--laranja:#FF713D}
body{font-family:Arial,sans-serif;background:#fff;color:#251A40}
header{padding:28px 7%;display:flex;align-items:center}
.logo{display:flex;align-items:center;gap:12px}
.logo svg{width:58px;height:58px}
.nome{font-size:40px;font-weight:900;letter-spacing:-2px;color:var(--roxo)}
.nome span{color:var(--laranja)}
main{max-width:1200px;margin:auto;padding:65px 7%;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:60px}
.slogan{font-size:clamp(38px,5vw,62px);line-height:1.08;font-weight:800;letter-spacing:-2px;color:var(--roxo)}
.slogan span{color:var(--laranja)}
.descricao{font-size:17px;line-height:1.7;color:#777083;margin-top:25px;max-width:430px}
.botoes{display:flex;gap:14px;margin-top:32px;flex-wrap:wrap}
button{padding:17px 24px;border-radius:12px;font-size:15px;font-weight:bold;cursor:pointer}
.passageiro{background:var(--roxo);color:white;border:0}
.motorista{background:white;color:var(--roxo);border:2px solid var(--roxo)}
.visual{background:linear-gradient(145deg,#5126D8,#321080);border-radius:32px;min-height:390px;padding:40px;color:white;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.visual:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:var(--laranja);right:-90px;top:-100px}
.visual h2{font-size:34px;position:relative;z-index:1}
.carro{font-size:100px;text-align:center}
.visual p{font-size:16px;line-height:1.6;position:relative;z-index:1}
footer{text-align:center;padding:25px;color:#898296;font-size:13px}
@media(max-width:750px){
main{grid-template-columns:1fr;padding:35px 7%;gap:35px}
.botoes{flex-direction:column}
button{width:100%}
.visual{min-height:310px}
}
</style>
</head>
<body>

<header>
<div class="logo">
<svg viewBox="0 0 100 100" aria-label="Símbolo VUPA">
<path d="M12 17 L42 78 Q50 95 59 78 L88 17"
fill="none" stroke="#5126D8" stroke-width="17"
stroke-linecap="round" stroke-linejoin="round"/>
<path d="M52 80 L88 17"
fill="none" stroke="#FF713D" stroke-width="17"
stroke-linecap="round"/>
</svg>
<div class="nome">VUPA<span>.</span></div>
</div>
</header>

<main>
<section>
<h1 class="slogan">
Sua corrida,<br>
<span>segura.</span>
</h1>

<p class="descricao">
Mobilidade conectando passageiros e motoristas.
Uma nova experiência para suas viagens de carro e moto.
</p>

<div class="botoes">
<button class="passageiro" onclick="alert('Cadastro de passageiros em desenvolvimento.')">
Sou passageiro
</button>
<button class="motorista" onclick="alert('Cadastro de motoristas em desenvolvimento.')">
Quero dirigir
</button>
</div>
</section>

<section class="visual">
<h2>Sua corrida,<br>segura.</h2>
<div class="carro">🚘</div>
<p>VUPA — Mobilidade para todos.</p>
</section>
</main>

<footer>VUPA © 2026</footer>
</body>
</html>
