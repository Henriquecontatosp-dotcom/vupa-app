
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5126D8">
<title>VUPA | Sua corrida, segura.</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --roxo: #5126D8;
  --roxo-escuro: #321080;
  --laranja: #FF713D;
  --branco: #FFFFFF;
}

body {
  font-family: Arial, sans-serif;
  min-height: 100vh;
  background: var(--roxo);
  color: var(--branco);
}

.tela {
  min-height: 100vh;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 30px 24px;
  text-align: center;
}

.tela.ativa {
  display: flex;
}

/* ABERTURA */

#splash {
  animation: aparecer 0.8s ease;
}

.logo {
  font-size: clamp(76px, 18vw, 112px);
  font-weight: 900;
  letter-spacing: -7px;
  color: var(--laranja);
  animation: pulsar 1.5s ease-in-out infinite;
}

.logo span {
  color: white;
}

.slogan {
  font-size: 17px;
  margin-top: 12px;
  letter-spacing: 1px;
  opacity: 0.9;
}

.indicador {
  width: 42px;
  height: 4px;
  background: rgba(255,255,255,0.25);
  border-radius: 10px;
  margin-top: 65px;
  overflow: hidden;
}

.indicador::after {
  content: "";
  display: block;
  width: 100%;
  height: 100%;
  background: var(--laranja);
  animation: carregar 1.8s ease forwards;
}

/* GPS */

.icone-gps {
  width: 94px;
  height: 94px;
  border: 2px solid rgba(255,255,255,0.3);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  margin-bottom: 30px;
}

h1 {
  font-size: clamp(27px, 6vw, 36px);
  line-height: 1.2;
  max-width: 420px;
}

.descricao {
  font-size: 16px;
  line-height: 1.6;
  opacity: 0.85;
  max-width: 390px;
  margin-top: 16px;
}

.botao {
  width: 100%;
  max-width: 340px;
  min-height: 56px;
  border: none;
  border-radius: 14px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 30px;
  background: var(--laranja);
  color: white;
}

.secundario {
  margin-top: 14px;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.5);
}

.botao:disabled {
  opacity: 0.6;
  cursor: wait;
}

/* PERFIS */

.perfis {
  width: 100%;
  max-width: 360px;
  display: grid;
  gap: 16px;
  margin-top: 35px;
}

.perfil {
  background: white;
  color: var(--roxo);
  border: none;
  border-radius: 16px;
  min-height: 85px;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

.perfil span {
  display: block;
  font-size: 13px;
  color: #777;
  font-weight: normal;
  margin-top: 5px;
}

.mensagem {
  min-height: 24px;
  margin-top: 16px;
  font-size: 14px;
  opacity: 0.9;
}

@keyframes pulsar {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

@keyframes carregar {
  from { transform: translateX(-100%); }
  to { transform: translateX(0); }
}

@keyframes aparecer {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>

<body>

<!-- TELA DE ABERTURA -->

<section id="splash" class="tela ativa">
  <div class="logo">VUPA<span>.</span></div>
  <p class="slogan">Sua corrida, segura.</p>
  <div class="indicador"></div>
</section>

<!-- LOCALIZAÇÃO -->

<section id="gps" class="tela">
  <div class="icone-gps">⌖</div>

  <h1>Vamos encontrar você?</h1>

  <p class="descricao">
    Permita o acesso à localização do seu aparelho
    para encontrar motoristas próximos e facilitar
    suas viagens com a VUPA.
  </p>

  <button class="botao" id="permitirGps" onclick="solicitarGPS()">
    Permitir localização
  </button>

  <button class="botao secundario" onclick="continuarSemGPS()">
    Continuar sem GPS
  </button>

  <p class="mensagem" id="mensagemGps"></p>
</section>

<!-- ESCOLHA DO PERFIL -->

<section id="perfis" class="tela">
  <div class="logo" style="font-size:65px">VUPA<span>.</span></div>

  <h1>Como você quer usar a VUPA?</h1>

  <p class="descricao">
    Escolha seu perfil para continuar.
  </p>

  <div class="perfis">
    <button class="perfil" onclick="selecionarPerfil('passageiro')">
      Sou passageiro
      <span>Quero solicitar uma corrida</span>
    </button>

    <button class="perfil" onclick="selecionarPerfil('motorista')">
      Sou motorista
      <span>Quero dirigir com a VUPA</span>
    </button>
  </div>

  <p class="mensagem" id="mensagemPerfil"></p>
</section>

<script>
const telas = ["splash", "gps", "perfis"];

function mostrarTela(id) {
  telas.forEach(tela => {
    document.getElementById(tela).classList.remove("ativa");
  });

  document.getElementById(id).classList.add("ativa");
}

setTimeout(() => {
  mostrarTela("gps");
}, 2200);

function solicitarGPS() {
  const botao = document.getElementById("permitirGps");
  const mensagem = document.getElementById("mensagemGps");

  if (!navigator.geolocation) {
    mensagem.textContent =
      "Seu aparelho não disponibiliza localização neste navegador.";
    return;
  }

  botao.disabled = true;
  botao.textContent = "Localizando...";
  mensagem.textContent = "Aguardando autorização do aparelho...";

  navigator.geolocation.getCurrentPosition(
    (posicao) => {
      const latitude = posicao.coords.latitude;
      const longitude = posicao.coords.longitude;

      sessionStorage.setItem("vupa_latitude", latitude);
      sessionStorage.setItem("vupa_longitude", longitude);

      mensagem.textContent = "Localização autorizada!";
      mostrarTela("perfis");
    },
    (erro) => {
      botao.disabled = false;
      botao.textContent = "Tentar novamente";

      if (erro.code === 1) {
        mensagem.textContent =
          "A localização foi bloqueada. Você pode continuar sem GPS.";
      } else {
        mensagem.textContent =
          "Não foi possível obter sua localização. Tente novamente ou continue sem GPS.";
      }
    },
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
}

function continuarSemGPS() {
  mostrarTela("perfis");
}

function selecionarPerfil(perfil) {
  document.getElementById("mensagemPerfil").textContent =
    perfil === "passageiro"
    ? "A próxima etapa será o acesso do passageiro."
    : "A próxima etapa será o cadastro do motorista.";
}
</script>

</body>
</html>
